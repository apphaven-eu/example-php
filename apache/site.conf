# Apache resolves ${PORT} from the environment, so the container listens on the
# port AppHaven assigns.
Listen ${PORT}
ServerName localhost

<VirtualHost *:${PORT}>
    DocumentRoot /app/public

    <Directory /app/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
